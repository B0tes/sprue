<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="generator" content="Sprue">
<title>Sprue</title>
<!-- The product page (pipeline/page.ts fills in the parts marked with comments): the stages at the top, the
     figure, then Design, Inspect, Source and Build from viewer/explorer.js. Dark unless the system is light. -->
<style>/*PAGE_CSS*/</style>
</head>
<body class="iso a2-body" data-theme="auto">
<main class="a2-page">
<!-- On a wide screen the figure stays in view beside the head and the stages, so what a row lights can be seen; on a
     narrow one it sits between them. -->
<div class="a2-run">
<!--PAGE_HEAD-->
<!--PAGE_FIGURE-->
<div id="a2-app" class="a2-app"></div>
</div>
<noscript><p class="a2-col a2-noscript">The parts, the offers and the build plan need JavaScript. The files they come from are in this product's folder.</p></noscript>
<footer class="a2-foot a2-col">
  Written from this product's files by <code>/sprue figure</code> and <code>/sprue view</code>. It works offline.
  Prices are offers read from supplier pages, not orders: nothing has been bought.
</footer>
</main>
<script type="application/json" id="a2-page-data">/*PAGE_DATA*/</script>
<script>/*FIGURE_JS*/</script>
<script type="module">
/*EXPLORER_JS*/

// The page: the stages under the figure. The two talk through a2:select, a2:hover and a2:step events.
const page = JSON.parse(document.getElementById("a2-page-data").textContent);
mount(document.getElementById("a2-app"), page.explorer, { layout: "stages", headingLevel: 2 });
const stage = document.querySelector(".a2-stage");
if (stage && page.figure && globalThis.mountFigure)
  globalThis.mountFigure(stage, page.figure, page.lines, { prices: page.prices, keys: "document", legend: false });
</script>
<!--MODEL-->
<!--MODEL_DATA-->
<script type="module">
/*MODEL_JS*/

// Fig 1's 3D tab, there when the folder has a model (pipeline/page.ts): the drawing, mounted above while it shows, is
// the first tab, and the 3D view is made the first time its tab opens, from the model and the three.js modules
// inlined above. It then asks the drawing where it is and starts there. The tab chosen is kept for the next page
// (localStorage), and #3d, or a part in the hash (#part=sw5), opens it.
{
  const section = document.querySelector("[data-a2-figure]");
  const pane = document.querySelector("#a2-pane-3d .a2-model-pane");
  const data = JSON.parse(document.getElementById("a2-model-data").textContent);
  const under = section.querySelector('[data-a2-model="under"]');
  let made = null;
  const make = () => (made ??= (async () => {
    const three = await threeFrom(data.three, (f) => document.querySelector(`script[data-a2-three="${CSS.escape(f.name)}"]`).textContent);
    const glb = Uint8Array.from(atob(data.glb), (c) => c.charCodeAt(0)).buffer;
    return mountModel(pane, data.view, glb, three, { readout: section.querySelector('[data-a2-readout="3d"]'), controls: under,
      legend: under, panel: under, title: data.title, fileHref: fileLink });
  })().catch((error) => {
    const why = document.createElement("p");
    why.className = "a2-model-wait";
    why.textContent = `The 3D view couldn't load here (${error && error.message ? error.message : error}). The drawing shows the product.`;
    pane.replaceChildren(why);
    return null;
  }));
  const tabs = mountTabs(section, { remember: "sprue:fig1", initial: tabOfHash(location.hash), onShow: (name) => { if (name === "3d") make(); } });
  addEventListener("hashchange", () => { if (tabOfHash(location.hash)) tabs.show("3d"); });
  globalThis.sprueFig1 = { tabs, model: () => made };
}
</script>
<!--/MODEL-->
</body>
</html>
