name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      # The vendored three.js is what the script makes from npm's tarball, held to npm's hash, byte for byte.
      - name: Vendored three.js
        run: node scripts/vendor-three.mjs --check
  # The pipeline's own tests: every gate, check and refusal of the skill. With the Python the CAD, the whole-product
  # check and the board's read-back use (cad/requirements.txt, then the read-back's pins without their dependencies,
  # as pipeline/pcb/requirements.txt says), and KiCad for the board's cross-check; the emulator the firmware runs on is
  # fetched on the first run and kept between runs. Ubuntu 24.04, not ubuntu-latest: its own kicad package is 7.0.11,
  # the version the cross-check is tested on.
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15
      # 3.13 is the job's python3 (the last listed is the default); 3.11 is there only for the test that makes an old
      # venv with it. KiCad's DRC runs on the system's own Python, below.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.13
          cache: pip
          cache-dependency-path: |
            skills/sprue/cad/requirements.txt
            skills/sprue/pipeline/pcb/requirements.txt
      - run: python -m pip install -r skills/sprue/cad/requirements.txt
      - run: python -m pip install --no-deps -r skills/sprue/pipeline/pcb/requirements.txt
      # KiCad's pcbnew comes with the package for the system's own Python (/usr/bin/python3, 3.12), one of the places
      # kicad.py looks. No recommends: they are the footprint and symbol libraries and the demos, which the check never
      # reads (the 3D models are only suggested, so apt leaves them out either way).
      - name: Install KiCad 7.0.11
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          v=$(/usr/bin/python3 -I -c 'import pcbnew; print(pcbnew.Version())' | tail -n 1)
          echo "KiCad $v"
          if [ "$v" != 7.0.11 ]; then echo "::error::the cross-check is tested on KiCad 7.0.11, and this runner has ${v:-none}"; exit 1; fi
      # The emulator and the fabs' KiCad rule files, each pinned by sha256 in these two files.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sprue
          key: sprue-tools-${{ hashFiles('skills/sprue/pipeline/firmware/cache.ts', 'skills/sprue/pipeline/pcb/kicad.ts') }}
      # Fetched once here, so the test files that run in parallel don't each fetch it into the same cache.
      - name: Fetch the firmware emulator
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e
          "const { ensureTools } = await import('./skills/sprue/pipeline/firmware/cache.ts');
          const r = await ensureTools(); if (!r.ok) { console.error(r.message); process.exit(1); }
          console.log('emulator ready' + (r.fetched.length ? ': fetched ' + r.fetched.join(', ') : ', cached'));"
      # The same for the rule files the cross-check runs KiCad's DRC with, so a fetch that fails says so here.
      - name: Fetch the KiCad rule files
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e
          "const { ruleFiles } = await import('./skills/sprue/pipeline/pcb/kicad.ts');
          const r = await ruleFiles(); if (r.notes.length) { console.error(r.notes.join('\\n')); process.exit(1); }
          console.log('KiCad rule files ready: ' + Object.keys(r.texts).join(', '));"
      # SPRUE_KICAD_TESTS=1: the cross-check's tests fail where they can't run, rather than skipping.
      - name: Pipeline tests
        env:
          SPRUE_KICAD_TESTS: "1"
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          --test 'skills/sprue/pipeline/**/*.test.ts' 'src/**/*.test.ts'
